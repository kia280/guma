syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service GumaService {
  // Navigation and UI
  rpc GetNavigation(GetNavigationRequest) returns (GetNavigationResponse) {
    option (google.api.http) = {
      get: "/v1/navigation"
    };
  }

  rpc GetDashboardData(GetDashboardDataRequest) returns (GetDashboardDataResponse) {
    option (google.api.http) = {
      get: "/v1/dashboard/{guild_id}"
    };
  }

  // User preferences
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse) {
    option (google.api.http) = {
      get: "/v1/preferences"
    };
  }

  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse) {
    option (google.api.http) = {
      put: "/v1/preferences"
      body: "*"
    };
  }

  // Application configuration
  rpc GetAppConfig(GetAppConfigRequest) returns (GetAppConfigResponse) {
    option (google.api.http) = {
      get: "/v1/config"
    };
  }

  // Global search
  rpc SearchGlobal(SearchGlobalRequest) returns (SearchGlobalResponse) {
    option (google.api.http) = {
      get: "/v1/search"
    };
  }
}

// Request/Response messages
message GetNavigationRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];  // Optional: guild-specific navigation
}

message GetNavigationResponse {
  repeated NavigationItem items = 1;
}

message GetDashboardDataRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
}

message GetDashboardDataResponse {
  DashboardData data = 1;
}

message GetUserPreferencesRequest {}

message GetUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message UpdateUserPreferencesRequest {
  UserPreferences preferences = 1 [(buf.validate.field).required = true];
}

message UpdateUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message GetAppConfigRequest {}

message GetAppConfigResponse {
  AppConfig config = 1;
}

message SearchGlobalRequest {
  string query = 1 [(buf.validate.field).string = {min_len: 1, max_len: 200}];
  string guild_id = 2 [(buf.validate.field).string.max_len = 64];  // Optional: scope to guild
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];      // Default: 20
}

message SearchGlobalResponse {
  SearchResults results = 1;
}

// Data structures
message NavigationItem {
  string id = 1;
  string label = 2;
  string icon = 3;
  string path = 4;
  int32 order = 5;
  repeated NavigationItem children = 6;
  map<string, string> metadata = 7;
  bool visible = 8;
}

message UserPreferences {
  string theme = 1 [(buf.validate.field).string.max_len = 32];              // "light", "dark", "auto"
  string language = 2 [(buf.validate.field).string.max_len = 64];           // "en", "ja", etc.
  string timezone = 3 [(buf.validate.field).string.max_len = 64];           // IANA timezone
  string date_format = 4 [(buf.validate.field).string.max_len = 64];        // Date display format
  string time_format = 5 [(buf.validate.field).string.max_len = 64];        // 12h/24h
  map<string, string> ui_settings = 6 [(buf.validate.field).map = {max_pairs: 50, keys: {string: {max_len: 100}}, values: {string: {max_len: 2000}}}];  // Custom UI settings
}

message DashboardData {
  repeated Activity recent_activities = 1;
  repeated Notification notifications = 2;
  QuickStats stats = 3;
}

message Activity {
  string id = 1;
  string type = 2;
  string description = 3;
  string actor_id = 4;
  string actor_name = 5;
  google.protobuf.Timestamp timestamp = 6;
  map<string, string> metadata = 7;
}

message Notification {
  string id = 1;
  string title = 2;
  string message = 3;
  string type = 4;  // "info", "warning", "error", "success"
  bool read = 5;
  google.protobuf.Timestamp created_at = 6;
  string action_url = 7;
  google.protobuf.Struct params = 8;
}

message QuickStats {
  int32 guild_count = 1;
  int32 unread_notifications = 2;
  int32 pending_invitations = 3;
  map<string, int32> custom_stats = 4;
}

message AppConfig {
  string version = 1;
  map<string, bool> features = 2;
  map<string, string> settings = 3;
  Limits limits = 4;
}

message Limits {
  int32 max_guilds_per_user = 1;
  int32 max_members_per_guild = 2;
  int64 max_file_size_bytes = 3;
}

message SearchResults {
  repeated SearchResult items = 1;
  int32 total_count = 2;
}

message SearchResult {
  string id = 1;
  string type = 2;  // "guild", "member", "event", etc.
  string title = 3;
  string description = 4;
  string url = 5;
  map<string, string> metadata = 6;
}
