syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service AnnouncementService {
  rpc ListAnnouncements(ListAnnouncementsRequest) returns (ListAnnouncementsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/announcements"
    };
  }

  rpc GetAnnouncement(GetAnnouncementRequest) returns (GetAnnouncementResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/announcements/{announcement_id}"
    };
  }

  rpc CreateAnnouncementDraft(CreateAnnouncementDraftRequest) returns (CreateAnnouncementDraftResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/announcements"
      body: "*"
    };
  }

  rpc UpdateAnnouncement(UpdateAnnouncementRequest) returns (UpdateAnnouncementResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/announcements/{announcement_id}"
      body: "*"
    };
  }

  rpc PublishAnnouncement(PublishAnnouncementRequest) returns (PublishAnnouncementResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/announcements/{announcement_id}/publish"
      body: "*"
    };
  }

  rpc UnpublishAnnouncement(UnpublishAnnouncementRequest) returns (UnpublishAnnouncementResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/announcements/{announcement_id}/unpublish"
      body: "*"
    };
  }

  rpc DeleteAnnouncementDraft(DeleteAnnouncementDraftRequest) returns (DeleteAnnouncementDraftResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/announcements/{announcement_id}"
    };
  }
}

message Announcement {
  string id = 1;
  string guild_id = 2;
  string author_id = 3;
  string author_name = 4;
  string title = 5;
  string content = 6;
  bool pinned = 7;
  string status = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListAnnouncementsRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  bool include_drafts = 2;
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
}

message ListAnnouncementsResponse {
  repeated Announcement announcements = 1;
}

message GetAnnouncementRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  string announcement_id = 2 [(buf.validate.field).string.max_len = 64];
}

message GetAnnouncementResponse {
  Announcement announcement = 1;
}

message CreateAnnouncementDraftRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
}

message CreateAnnouncementDraftResponse {
  Announcement announcement = 1;
}

message UpdateAnnouncementRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  string announcement_id = 2 [(buf.validate.field).string.max_len = 64];
  string title = 3 [(buf.validate.field).string.max_len = 200];
  string content = 4 [(buf.validate.field).string.max_len = 20000];
  bool pinned = 5;
}

message UpdateAnnouncementResponse {
  Announcement announcement = 1;
}

message PublishAnnouncementRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  string announcement_id = 2 [(buf.validate.field).string.max_len = 64];
}

message PublishAnnouncementResponse {
  Announcement announcement = 1;
}

message UnpublishAnnouncementRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  string announcement_id = 2 [(buf.validate.field).string.max_len = 64];
}

message UnpublishAnnouncementResponse {
  Announcement announcement = 1;
}

message DeleteAnnouncementDraftRequest {
  string guild_id = 1 [(buf.validate.field).string.max_len = 64];
  string announcement_id = 2 [(buf.validate.field).string.max_len = 64];
}

message DeleteAnnouncementDraftResponse {}
