syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// TransactionType values: DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT,
//   REWARD, PENALTY, AUCTION_BID, AUCTION_WIN, RAFFLE_TICKET, RAFFLE_WIN,
//   WITHDRAWAL_REQUEST, WITHDRAWAL_APPROVED, WITHDRAWAL_REJECTED, WITHDRAWAL_CANCELLED
// ItemSource values: auction, raffle, transfer, admin

service WalletService {
  // Get the current user's wallet for a specific guild
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/wallet"
    };
  }

  rpc DepositFunds(DepositFundsRequest) returns (TransactionResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/wallet/deposit"
      body: "*"
    };
  }

  rpc WithdrawFunds(WithdrawFundsRequest) returns (TransactionResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/wallet/withdraw"
      body: "*"
    };
  }

  rpc ListMyWithdrawalRequests(ListMyWithdrawalRequestsRequest) returns (ListMyWithdrawalRequestsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/wallet/withdrawals"
    };
  }

  rpc CancelWithdrawalRequest(CancelWithdrawalRequestRequest) returns (CancelWithdrawalRequestResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/wallet/withdrawals/{request_id}/cancel"
      body: "*"
    };
  }

  rpc ListWithdrawalRequests(ListWithdrawalRequestsRequest) returns (ListWithdrawalRequestsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/withdrawal-requests"
    };
  }

  rpc ReviewWithdrawalRequest(ReviewWithdrawalRequestRequest) returns (ReviewWithdrawalRequestResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/withdrawal-requests/{request_id}"
      body: "*"
    };
  }

  rpc TransferFunds(TransferFundsRequest) returns (TransactionResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/wallet/transfer"
      body: "*"
    };
  }

  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/wallet/transactions"
    };
  }

  // Daily balance history of the current user's wallet within this guild
  rpc GetBalanceTrend(GetBalanceTrendRequest) returns (GetBalanceTrendResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/wallet/balance-trend"
    };
  }

  // Backpack: items owned by the current user within this guild
  rpc ListBackpackItems(ListBackpackItemsRequest) returns (ListBackpackItemsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/backpack"
    };
  }

  rpc WithdrawBackpackItem(WithdrawBackpackItemRequest) returns (WithdrawBackpackItemResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/backpack/{item_id}/withdraw"
      body: "*"
    };
  }

  rpc TransferBackpackItem(TransferBackpackItemRequest) returns (TransferBackpackItemResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/backpack/{item_id}/transfer"
      body: "*"
    };
  }

  rpc CancelBackpackWithdrawal(CancelBackpackWithdrawalRequest) returns (CancelBackpackWithdrawalResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/backpack/{item_id}/withdraw/cancel"
      body: "*"
    };
  }

  rpc ListPendingDeliveries(ListPendingDeliveriesRequest) returns (ListPendingDeliveriesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/deliveries"
    };
  }

  rpc ConfirmBackpackDelivery(ConfirmBackpackDeliveryRequest) returns (ConfirmBackpackDeliveryResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/deliveries/{item_id}/confirm"
      body: "*"
    };
  }

  rpc ListMemberAssets(ListMemberAssetsRequest) returns (ListMemberAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/admin/member-assets"
    };
  }

  rpc GetMemberAssets(GetMemberAssetsRequest) returns (GetMemberAssetsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/admin/member-assets/{user_id}"
    };
  }

  rpc AdminTransferFunds(AdminTransferFundsRequest) returns (AdminTransferFundsResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/admin/member-assets/{user_id}/funds/transfer"
      body: "*"
    };
  }

  rpc AdminTransferBackpackItems(AdminTransferBackpackItemsRequest) returns (AdminTransferBackpackItemsResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/admin/member-assets/{user_id}/items/transfer"
      body: "*"
    };
  }
}

// Request/Response messages

message GetWalletRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message DepositFundsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int64 amount = 2 [(buf.validate.field).int64 = {gt: 0, lte: 100000000000000}];
  string note = 3 [(buf.validate.field).string.max_len = 200];
}

message WithdrawFundsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int64 amount = 2 [(buf.validate.field).int64 = {gt: 0, lte: 100000000000000}];
  string note = 3 [(buf.validate.field).string.max_len = 200];
}

message TransferFundsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string to_user_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int64 amount = 3 [(buf.validate.field).int64 = {gt: 0, lte: 100000000000000}];
  string note = 4 [(buf.validate.field).string.max_len = 200];
}

message TransactionResponse {
  Transaction transaction = 1;
  Wallet updated_wallet = 2;
  WithdrawalRequest withdrawal_request = 3;
}

message ListMyWithdrawalRequestsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string status = 2 [(buf.validate.field).string = {max_len: 32, in: ["", "pending", "approved", "rejected", "cancelled"]}];
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 4 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message ListMyWithdrawalRequestsResponse {
  repeated WithdrawalRequest requests = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message CancelWithdrawalRequestRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message CancelWithdrawalRequestResponse {
  WithdrawalRequest withdrawal_request = 1;
  Wallet updated_wallet = 2;
}

message ListWithdrawalRequestsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string status = 2 [(buf.validate.field).string = {max_len: 32, in: ["", "pending", "approved", "rejected", "cancelled"]}];
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 4 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message ListWithdrawalRequestsResponse {
  repeated WithdrawalRequest requests = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ReviewWithdrawalRequestRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string request_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string status = 3 [(buf.validate.field).string = {in: ["approved", "rejected"]}];
  string note = 4 [(buf.validate.field).string.max_len = 200];
}

message ReviewWithdrawalRequestResponse {
  WithdrawalRequest withdrawal_request = 1;
}

message ListTransactionsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string type = 2 [(buf.validate.field).string.max_len = 32];      // TransactionType filter; empty = all
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 4 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message ListBackpackItemsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 3 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message ListBackpackItemsResponse {
  repeated BackpackItem items = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message WithdrawBackpackItemRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string item_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message WithdrawBackpackItemResponse {
  BackpackItem item = 1;
}

message TransferBackpackItemRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string item_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string to_user_id = 3 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string note = 4 [(buf.validate.field).string.max_len = 200];
}

message TransferBackpackItemResponse {
  BackpackItem item = 1;
}

message GetBalanceTrendRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int32 days = 2 [(buf.validate.field).int32 = {gte: 0, lte: 365}]; // Default: 30
}

message GetBalanceTrendResponse {
  repeated BalancePoint points = 1;
}

// Data structures

message Wallet {
  // user_id serves as the wallet identifier within a guild
  string user_id = 1;
  string guild_id = 2;
  int64 balance = 3;
  string currency = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int64 locked_in_bids = 7;
  repeated LockedBid locked_bids = 8;
  int64 pending_withdrawals = 9;
}

message WithdrawalRequest {
  string id = 1;
  string guild_id = 2;
  string requester_id = 3;
  string requester_name = 4;
  string requester_avatar_url = 5;
  int64 amount = 6;
  string note = 7;
  string status = 8;
  string reviewer_id = 9;
  string reviewer_name = 10;
  string review_note = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp reviewed_at = 13;
}

message LockedBid {
  string auction_id = 1;
  string item_name = 2;
  int64 amount = 3;
  google.protobuf.Timestamp end_time = 4;
}

message BalancePoint {
  string date = 1; // ISO 8601 date
  int64 balance = 2;
}

message Transaction {
  string id = 1;
  string user_id = 2;
  string guild_id = 3;
  string type = 4;
  int64 amount = 5;
  int64 balance_after = 6;
  string description = 7;
  string reference_id = 8;    // Linked entity ID (auction_id, raffle_id, etc.)
  string reference_type = 9;  // "auction" | "raffle" | "roll_call" | "withdrawal" | "manual"
  google.protobuf.Timestamp created_at = 10;
  string actor_id = 11;
  string actor_name = 12;
  string counterparty_id = 13;
  string counterparty_name = 14;
}

message BackpackItem {
  string id = 1;
  string owner_id = 2;
  string guild_id = 3;
  Item item = 4;
  string source = 5;      // ItemSource
  string source_id = 6;   // ID of the originating auction/raffle
  string note = 7;
  google.protobuf.Timestamp acquired_at = 8;
  string source_label = 9;
  google.protobuf.Timestamp delivery_requested_at = 10;
  string owner_name = 11;
  ItemLock lock = 20;
}

message CancelBackpackWithdrawalRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string item_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message CancelBackpackWithdrawalResponse {
  BackpackItem item = 1;
}

message ListPendingDeliveriesRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message ListPendingDeliveriesResponse {
  repeated BackpackItem items = 1;
}

message ConfirmBackpackDeliveryRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string item_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message ConfirmBackpackDeliveryResponse {
  BackpackItem item = 1;
}

message ListMemberAssetsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message MemberAssetSummary {
  string user_id = 1;
  int64 balance = 2;
  int32 item_count = 3;
}

message ListMemberAssetsResponse {
  repeated MemberAssetSummary members = 1;
}

message GetMemberAssetsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetMemberAssetsResponse {
  string user_id = 1;
  int64 balance = 2;
  repeated BackpackItem items = 3;
}

message AdminTransferFundsRequest {
  option (buf.validate.message).oneof = {
    fields: ["to_user_id", "to_guild_bank"]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "admin_transfer_funds.to_user_id_differs"
    message: "source and destination must differ"
    expression: "this.to_user_id == '' || this.to_user_id != this.user_id"
  };

  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string to_user_id = 3 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  bool to_guild_bank = 4;
  int64 amount = 5 [(buf.validate.field).int64 = {gt: 0, lte: 100000000000000}];
  string note = 6 [(buf.validate.field).string.max_len = 200];
}

message AdminTransferFundsResponse {
  Transaction transaction = 1;
  int64 balance = 2;
}

message AdminTransferBackpackItemsRequest {
  option (buf.validate.message).oneof = {
    fields: ["to_user_id", "to_guild_bank"]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "admin_transfer_backpack_items.to_user_id_differs"
    message: "source and destination must differ"
    expression: "this.to_user_id == '' || this.to_user_id != this.user_id"
  };

  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  repeated string item_ids = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, items: {string: {uuid: true}}}];
  string to_user_id = 4 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  bool to_guild_bank = 5;
  string note = 6 [(buf.validate.field).string.max_len = 200];
}

message AdminTransferBackpackItemsResponse {
  repeated string item_ids = 1;
}
