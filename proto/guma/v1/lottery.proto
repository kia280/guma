syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service LotteryService {
  rpc ListLotteries(ListLotteriesRequest) returns (ListLotteriesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/lotteries"
    };
  }

  rpc GetLottery(GetLotteryRequest) returns (GetLotteryResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/lotteries/{lottery_id}"
    };
  }

  rpc CreateLottery(CreateLotteryRequest) returns (CreateLotteryResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/lotteries"
      body: "*"
    };
  }

  rpc PurchaseTickets(PurchaseTicketsRequest) returns (PurchaseTicketsResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/lotteries/{lottery_id}/tickets"
      body: "*"
    };
  }

  rpc GetLotteryWinners(GetLotteryWinnersRequest) returns (GetLotteryWinnersResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/lotteries/{lottery_id}/winners"
    };
  }

  // Update a lottery that has not been drawn yet (admin action)
  rpc UpdateLottery(UpdateLotteryRequest) returns (UpdateLotteryResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/lotteries/{lottery_id}"
      body: "*"
    };
  }

  rpc CancelLottery(CancelLotteryRequest) returns (CancelLotteryResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/lotteries/{lottery_id}/cancel"
      body: "*"
    };
  }

  rpc DeleteLottery(DeleteLotteryRequest) returns (DeleteLotteryResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/lotteries/{lottery_id}"
    };
  }

  // Draw the lottery manually (admin action)
  rpc DrawLottery(DrawLotteryRequest) returns (DrawLotteryResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/lotteries/{lottery_id}/draw"
      body: "*"
    };
  }

  // List tickets owned by the current user
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsResponse) {
    option (google.api.http) = {
      get: "/v1/me/lottery-tickets"
    };
  }
}

// Request/Response messages

message ListLotteriesRequest {
  string guild_id = 1;
  string status = 2;     // "active" | "upcoming" | "ended" | "cancelled" | "" (all)
  int32 page_size = 3;
  string page_token = 4;
}

message ListLotteriesResponse {
  repeated Lottery lotteries = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetLotteryRequest {
  string guild_id = 1;
  string lottery_id = 2;
}

message GetLotteryResponse {
  Lottery lottery = 1;
}

message CreateLotteryRequest {
  string guild_id = 1;
  string title = 2;
  string description = 3;
  int64 ticket_price = 4;
  int32 max_tickets = 5;         // 0 = unlimited
  int32 max_tickets_per_user = 6; // 0 = unlimited
  string draw_date = 7;           // ISO 8601 datetime
  repeated LotteryPrize prizes = 8;
}

message CreateLotteryResponse {
  Lottery lottery = 1;
}

message PurchaseTicketsRequest {
  string guild_id = 1;
  string lottery_id = 2;
  int32 quantity = 3;
}

message PurchaseTicketsResponse {
  repeated LotteryTicket tickets = 1;
  int64 total_cost = 2;
}

message GetLotteryWinnersRequest {
  string guild_id = 1;
  string lottery_id = 2;
}

message GetLotteryWinnersResponse {
  repeated LotteryWinner winners = 1;
}

message DrawLotteryRequest {
  string guild_id = 1;
  string lottery_id = 2;
}

message DrawLotteryResponse {
  Lottery lottery = 1;
  repeated LotteryWinner winners = 2;
}

message UpdateLotteryRequest {
  string guild_id = 1;
  string lottery_id = 2;
  string draw_date = 3; // ISO 8601 datetime; must be in the future
  optional string title = 4;
  optional string description = 5;
  optional int64 ticket_price = 6;
  optional int32 max_tickets = 7;
  optional int32 max_tickets_per_user = 8;
}

message UpdateLotteryResponse {
  Lottery lottery = 1;
}

message CancelLotteryRequest {
  string guild_id = 1;
  string lottery_id = 2;
}

message CancelLotteryResponse {
  Lottery lottery = 1;
}

message DeleteLotteryRequest {
  string guild_id = 1;
  string lottery_id = 2;
}

message DeleteLotteryResponse {
  bool success = 1;
}

message ListMyTicketsRequest {
  string guild_id = 1; // Optional: filter by guild
  int32 page_size = 2;
  string page_token = 3;
}

message ListMyTicketsResponse {
  repeated LotteryTicket tickets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Data structures

// LotteryStatus values: upcoming, active, ended, cancelled

message Lottery {
  string id = 1;
  string guild_id = 2;
  string created_by = 3;
  string title = 4;
  string description = 5;
  int64 ticket_price = 6;
  int32 tickets_sold = 7;
  int32 max_tickets = 8;
  int32 max_tickets_per_user = 9;
  string status = 10;
  string draw_date = 11;        // ISO 8601 datetime
  repeated LotteryPrize prizes = 12;
  repeated LotteryWinner winners = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp cancelled_at = 16;
}

message LotteryPrize {
  int32 rank = 1;          // 1st, 2nd, 3rd place
  string description = 2;
  int64 amount = 3;        // Currency prize; 0 if item prize
  Item item = 4;           // Item prize; unset if currency prize
  ItemSourceRef source = 5;
}

message LotteryTicket {
  string id = 1;
  string lottery_id = 2;
  string user_id = 3;
  string ticket_number = 4;
  google.protobuf.Timestamp purchased_at = 5;
}

message LotteryWinner {
  string id = 1;
  string lottery_id = 2;
  string user_id = 3;
  string username = 4;
  string avatar_url = 5;
  int32 rank = 6;
  int64 prize_amount = 7;
  string prize_description = 8;
  string ticket_number = 9;
}
