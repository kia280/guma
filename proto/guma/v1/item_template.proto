syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/validate.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service ItemTemplateService {
  rpc ListItemTemplates(ListItemTemplatesRequest) returns (ListItemTemplatesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/item-templates"
    };
  }

  rpc CreateItemTemplate(CreateItemTemplateRequest) returns (CreateItemTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/item-templates"
      body: "*"
    };
  }

  rpc UpdateItemTemplate(UpdateItemTemplateRequest) returns (UpdateItemTemplateResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/item-templates/{template_id}"
      body: "*"
    };
  }

  rpc DeleteItemTemplate(DeleteItemTemplateRequest) returns (DeleteItemTemplateResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/item-templates/{template_id}"
    };
  }
}

message ListItemTemplatesRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message ListItemTemplatesResponse {
  repeated ItemTemplate templates = 1;
}

message CreateItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {[guma.v1.name]: true, [guma.v1.not_blank]: true}];
  string description = 3 [(buf.validate.field).string = {[guma.v1.paragraph]: true}];
  string category = 4 [(buf.validate.field).string = {[guma.v1.keyword]: true}, (buf.validate.field).cel = {
    id: "category.allowed"
    message: "category must be one of weapon, armor, accessory, consumable, skill_scroll, material, misc"
    expression: "this.trim().lowerAscii() in ['weapon', 'armor', 'accessory', 'consumable', 'skill_scroll', 'material', 'misc']"
  }];
  string rarity = 5 [(buf.validate.field).string = {[guma.v1.keyword]: true}, (buf.validate.field).cel = {
    id: "rarity.allowed"
    message: "rarity must be one of common, uncommon, rare, epic, legendary, mythic"
    expression: "this.trim().lowerAscii() in ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic']"
  }];
}

message CreateItemTemplateResponse {
  ItemTemplate template = 1;
}

message UpdateItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string template_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {[guma.v1.name]: true, [guma.v1.not_blank]: true}];
  string description = 4 [(buf.validate.field).string = {[guma.v1.paragraph]: true}];
  string category = 5 [(buf.validate.field).string = {[guma.v1.keyword]: true}, (buf.validate.field).cel = {
    id: "category.allowed"
    message: "category must be one of weapon, armor, accessory, consumable, skill_scroll, material, misc"
    expression: "this.trim().lowerAscii() in ['weapon', 'armor', 'accessory', 'consumable', 'skill_scroll', 'material', 'misc']"
  }];
  string rarity = 6 [(buf.validate.field).string = {[guma.v1.keyword]: true}, (buf.validate.field).cel = {
    id: "rarity.allowed"
    message: "rarity must be one of common, uncommon, rare, epic, legendary, mythic"
    expression: "this.trim().lowerAscii() in ['common', 'uncommon', 'rare', 'epic', 'legendary', 'mythic']"
  }];
}

message UpdateItemTemplateResponse {
  ItemTemplate template = 1;
}

message DeleteItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string template_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message DeleteItemTemplateResponse {
  bool success = 1;
}

message ItemTemplate {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string rarity = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
