syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service ItemTemplateService {
  rpc ListItemTemplates(ListItemTemplatesRequest) returns (ListItemTemplatesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/item-templates"
    };
  }

  rpc CreateItemTemplate(CreateItemTemplateRequest) returns (CreateItemTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/item-templates"
      body: "*"
    };
  }

  rpc UpdateItemTemplate(UpdateItemTemplateRequest) returns (UpdateItemTemplateResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/item-templates/{template_id}"
      body: "*"
    };
  }

  rpc DeleteItemTemplate(DeleteItemTemplateRequest) returns (DeleteItemTemplateResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/item-templates/{template_id}"
    };
  }
}

message ListItemTemplatesRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message ListItemTemplatesResponse {
  repeated ItemTemplate templates = 1;
}

message CreateItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string name = 2 [(buf.validate.field).string = {max_len: 100, pattern: "[^\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]"}];
  string description = 3 [(buf.validate.field).string.max_len = 500];
  string category = 4 [(buf.validate.field).string = {max_len: 32, pattern: "^[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*(?:[wW][eE][aA][pP][oO][nN]|[aA][rR][mM][oO][rR]|[aA][cC][cC][eE][sS][sS][oO][rR][yY]|[cC][oO][nN][sS][uU][mM][aA][bB][lL][eE]|[sS][kK\\x{212A}][iI\\x{130}][lL][lL]_[sS][cC][rR][oO][lL][lL]|[mM][aA][tT][eE][rR][iI\\x{130}][aA][lL]|[mM][iI\\x{130}][sS][cC])[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*$"}];
  string rarity = 5 [(buf.validate.field).string = {max_len: 32, pattern: "^[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*(?:[cC][oO][mM][mM][oO][nN]|[uU][nN][cC][oO][mM][mM][oO][nN]|[rR][aA][rR][eE]|[eE][pP][iI\\x{130}][cC]|[lL][eE][gG][eE][nN][dD][aA][rR][yY]|[mM][yY][tT][hH][iI\\x{130}][cC])[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*$"}];
}

message CreateItemTemplateResponse {
  ItemTemplate template = 1;
}

message UpdateItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string template_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string name = 3 [(buf.validate.field).string = {max_len: 100, pattern: "[^\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]"}];
  string description = 4 [(buf.validate.field).string.max_len = 500];
  string category = 5 [(buf.validate.field).string = {max_len: 32, pattern: "^[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*(?:[wW][eE][aA][pP][oO][nN]|[aA][rR][mM][oO][rR]|[aA][cC][cC][eE][sS][sS][oO][rR][yY]|[cC][oO][nN][sS][uU][mM][aA][bB][lL][eE]|[sS][kK\\x{212A}][iI\\x{130}][lL][lL]_[sS][cC][rR][oO][lL][lL]|[mM][aA][tT][eE][rR][iI\\x{130}][aA][lL]|[mM][iI\\x{130}][sS][cC])[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*$"}];
  string rarity = 6 [(buf.validate.field).string = {max_len: 32, pattern: "^[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*(?:[cC][oO][mM][mM][oO][nN]|[uU][nN][cC][oO][mM][mM][oO][nN]|[rR][aA][rR][eE]|[eE][pP][iI\\x{130}][cC]|[lL][eE][gG][eE][nN][dD][aA][rR][yY]|[mM][yY][tT][hH][iI\\x{130}][cC])[\\t\\n\\x{0B}\\f\\r\\x{85}\\p{Z}]*$"}];
}

message UpdateItemTemplateResponse {
  ItemTemplate template = 1;
}

message DeleteItemTemplateRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string template_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message DeleteItemTemplateResponse {
  bool success = 1;
}

message ItemTemplate {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string rarity = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
