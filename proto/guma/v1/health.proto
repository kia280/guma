syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// HealthService provides Kubernetes probe endpoints for pod lifecycle management
service HealthService {
  // CheckReady checks if the application is ready to serve traffic.
  // Verifies all critical dependencies (database, cache) are available.
  // Returns 200 if ready, 503 if not ready.
  rpc CheckReady(CheckReadyRequest) returns (CheckResponse) {
    option (google.api.http) = {
      get: "/health/ready"
      body: ""
    };
  }

  // CheckLive checks if the application process is responsive.
  // Performs minimal check without dependency verification.
  // Returns 200 if alive, 500 if unresponsive.
  rpc CheckLive(CheckLiveRequest) returns (CheckResponse) {
    option (google.api.http) = {
      get: "/health/alive"
      body: ""
    };
  }
}

// StatusCode represents the overall health status of the application
enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  // SERVING indicates the application is ready to accept traffic
  STATUS_CODE_SERVING = 1;
  // NOT_READY indicates the application is not ready to accept traffic
  STATUS_CODE_NOT_READY = 2;
  // UNKNOWN indicates the health status could not be determined
  STATUS_CODE_UNKNOWN = 3;
}

// CheckReadyRequest is an empty request for the readiness probe
message CheckReadyRequest {}

// CheckLiveRequest is an empty request for the liveness probe
message CheckLiveRequest {}

// CheckResponse is the response from a health check
message CheckResponse {
  // status is the overall health status
  StatusCode status = 1;

  // database indicates if PostgreSQL is connected and responsive
  bool database = 2;

  // redis indicates if Redis cache is connected and responsive
  bool redis = 3;

  // startup_complete indicates if application startup initialization is done
  bool startup_complete = 4;

  // timestamp is the time the health check was performed (Unix nanoseconds)
  int64 timestamp = 5;
}
