syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service StreamService {
  rpc WatchUserEvents(WatchUserEventsRequest) returns (stream WatchUserEventsResponse) {
    option (google.api.http) = {
      get: "/v1/me/events"
    };
  }
}

message WatchUserEventsRequest {}

message WatchUserEventsResponse {
  google.protobuf.Timestamp occurred_at = 1;
  oneof event {
    Heartbeat heartbeat = 10;
    WalletUpdated wallet_updated = 11;
    ResourceChanged resource_changed = 12;
  }
}

message Heartbeat {}

message WalletUpdated {
  string guild_id = 1;
  int64 balance = 2;
}

message ResourceChanged {
  string guild_id = 1;
  string resource = 2;
  string resource_id = 3;
}
