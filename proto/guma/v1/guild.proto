syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service GuildService {
  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse) {
    option (google.api.http) = {
      post: "/v1/guilds"
      body: "*"
    };
  }

  rpc GetGuild(GetGuildRequest) returns (GetGuildResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}"
    };
  }

  // Returns the guild the authenticated user is currently active in
  rpc GetCurrentGuild(GetCurrentGuildRequest) returns (GetCurrentGuildResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/current"
    };
  }

  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse) {
    option (google.api.http) = {
      put: "/v1/guilds/{guild_id}"
      body: "*"
    };
  }

  rpc UploadGuildLogo(UploadGuildLogoRequest) returns (UploadGuildLogoResponse) {
    option (google.api.http) = {
      put: "/v1/guilds/{guild_id}/logo"
      body: "*"
    };
  }

  rpc DeleteGuildLogo(DeleteGuildLogoRequest) returns (DeleteGuildLogoResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/logo"
    };
  }

  rpc GetGuildLogo(GetGuildLogoRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/logo"
    };
  }

  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}"
    };
  }

  rpc ListGuilds(ListGuildsRequest) returns (ListGuildsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds"
    };
  }

  rpc JoinGuildById(JoinGuildByIdRequest) returns (JoinGuildByIdResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/join"
      body: "*"
    };
  }

  rpc LeaveGuild(LeaveGuildRequest) returns (LeaveGuildResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/leave"
      body: "*"
    };
  }

  rpc GetGuildSettings(GetGuildSettingsRequest) returns (GetGuildSettingsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/settings"
    };
  }

  rpc UpdateGuildSettings(UpdateGuildSettingsRequest) returns (UpdateGuildSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/guilds/{guild_id}/settings"
      body: "*"
    };
  }

  rpc GetGuildStats(GetGuildStatsRequest) returns (GetGuildStatsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/stats"
    };
  }
}

// Request/Response messages
message CreateGuildRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string description = 2 [(buf.validate.field).string.max_len = 2000];
  map<string, string> settings = 3 [(buf.validate.field).map = {max_pairs: 50, keys: {string: {max_len: 100}}, values: {string: {max_len: 2000}}}];
  reserved 4;
  reserved "tags";
}

message CreateGuildResponse {
  Guild guild = 1;
}

message GetGuildRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message GetGuildResponse {
  Guild guild = 1;
}

message UpdateGuildRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string name = 2 [(buf.validate.field).string.max_len = 100];
  string description = 3 [(buf.validate.field).string.max_len = 2000];
  reserved 4;
  reserved "tags";
  string icon_url = 5 [(buf.validate.field).string.max_len = 2048];
  string banner_url = 6 [(buf.validate.field).string.max_len = 2048];
}

message UpdateGuildResponse {
  Guild guild = 1;
}

message UploadGuildLogoRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  bytes data = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 524288}];
  string content_type = 3 [(buf.validate.field).string = {max_len: 100, pattern: "^[\\t\\n\\v\\f\\r\\x{85}\\p{Z}]*(?i:[i\\x{130}]mage/(?:png|jpeg|webp|g[i\\x{130}]f))[\\t\\n\\v\\f\\r\\x{85}\\p{Z}]*$"}];
}

message UploadGuildLogoResponse {
  Guild guild = 1;
}

message DeleteGuildLogoRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message DeleteGuildLogoResponse {
  Guild guild = 1;
}

message GetGuildLogoRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string v = 2 [(buf.validate.field).string.max_len = 64];
}

message DeleteGuildRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message DeleteGuildResponse {
  bool success = 1;
}

message ListGuildsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 2 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
  string search = 3 [(buf.validate.field).string.max_len = 200];   // Free-text search on name/description
  string order_by = 4 [(buf.validate.field).string.max_len = 32];
}

message ListGuildsResponse {
  repeated Guild guilds = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetGuildSettingsRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message GetGuildSettingsResponse {
  GuildSettings settings = 1;
}

message UpdateGuildSettingsRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  GuildSettings settings = 2 [(buf.validate.field).required = true];
}

message UpdateGuildSettingsResponse {
  GuildSettings settings = 1;
}

message GetGuildStatsRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message GetGuildStatsResponse {
  GuildStats stats = 1;
}

message GetCurrentGuildRequest {}

message GetCurrentGuildResponse {
  Guild guild = 1; // null/empty if user is not in any guild
}

message JoinGuildByIdRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message JoinGuildByIdResponse {
  Guild guild = 1;
}

message LeaveGuildRequest {
  string guild_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

message LeaveGuildResponse {
  bool success = 1;
}

// Data structures
message Guild {
  string id = 1;
  string name = 2;
  string description = 3;
  string owner_id = 4;
  reserved 5;
  reserved "tags";
  GuildSettings settings = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int32 member_count = 9;
  repeated Plugin plugins = 10;
  string icon_url = 11;
  string banner_url = 12;
}

message GuildStats {
  int32 member_count = 1;
  int64 bank_balance = 2;
  string bank_currency = 3;
  int32 active_event_count = 4;
  int32 bank_item_count = 5;
}

message Plugin {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string description = 5;
}

message GuildSettings {
  string timezone = 1 [(buf.validate.field).string.max_len = 64];
  string language = 2 [(buf.validate.field).string.max_len = 64];
  bool public = 3;
  bool allow_invites = 4;
  map<string, string> custom_settings = 5 [(buf.validate.field).map = {max_pairs: 50, keys: {string: {max_len: 100}}, values: {string: {max_len: 2000}}}];
}
