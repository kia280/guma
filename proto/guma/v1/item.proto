syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// Item is the shared structure for any in-game item across all features
// (auctions, backpack, bank, roll call loot, raffles).
//
// ItemCategory values: WEAPON, ARMOR, ACCESSORY, CONSUMABLE, SKILL_SCROLL, MATERIAL, MISC
// ItemRarity values: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC
message Item {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string rarity = 5;
}

message ItemSourceRef {
  option (buf.validate.message).cel = {
    id: "item_source_ref.single_source"
    message: "choose either a backpack item or a bank item"
    expression: "this.backpack_item_id == '' || this.bank_item_id == ''"
  };

  string backpack_item_id = 1 [(buf.validate.field).string.max_len = 64];
  string bank_item_id = 2 [(buf.validate.field).string.max_len = 64];
}

message ItemLock {
  string type = 1;
  string id = 2;
}
