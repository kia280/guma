syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "proto/guma/v1/validate.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// Item is the shared structure for any in-game item across all features
// (auctions, backpack, bank, roll call loot, raffles).
//
// ItemCategory values: weapon, armor, accessory, consumable, skill_scroll, material, misc
// ItemRarity values: common, uncommon, rare, epic, legendary, mythic
message Item {
  string id = 1 [(buf.validate.field).string = {[guma.v1.code]: true}];
  string name = 2 [(buf.validate.field).string = {[guma.v1.name]: true}];
  string description = 3 [(buf.validate.field).string = {[guma.v1.paragraph]: true}];
  string category = 4 [(buf.validate.field).string = {[guma.v1.keyword]: true, [guma.v1.item_category]: true}];
  string rarity = 5 [(buf.validate.field).string = {[guma.v1.keyword]: true, [guma.v1.item_rarity]: true}];
}

message ItemSourceRef {
  option (buf.validate.message).cel = {
    id: "item_source_ref.single_source"
    message: "choose either a backpack item or a bank item"
    expression: "this.backpack_item_id == '' || this.bank_item_id == ''"
  };

  string backpack_item_id = 1 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  string bank_item_id = 2 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
}

message ItemLock {
  string type = 1;
  string id = 2;
}
