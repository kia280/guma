syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service CheckInTemplateService {
  rpc ListCheckInTemplates(ListCheckInTemplatesRequest) returns (ListCheckInTemplatesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/checkin-templates"
    };
  }

  rpc CreateCheckInTemplate(CreateCheckInTemplateRequest) returns (CreateCheckInTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkin-templates"
      body: "*"
    };
  }

  rpc UpdateCheckInTemplate(UpdateCheckInTemplateRequest) returns (UpdateCheckInTemplateResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/checkin-templates/{template_id}"
      body: "*"
    };
  }

  rpc DeleteCheckInTemplate(DeleteCheckInTemplateRequest) returns (DeleteCheckInTemplateResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/checkin-templates/{template_id}"
    };
  }
}

message ListCheckInTemplatesRequest {
  string guild_id = 1;
}

message ListCheckInTemplatesResponse {
  repeated CheckInTemplate templates = 1;
}

message CreateCheckInTemplateRequest {
  string guild_id = 1;
  string name = 2;
  string title = 3;
  repeated Item loot_list = 4;
}

message CreateCheckInTemplateResponse {
  CheckInTemplate template = 1;
}

message UpdateCheckInTemplateRequest {
  string guild_id = 1;
  string template_id = 2;
  string name = 3;
  string title = 4;
  repeated Item loot_list = 5;
}

message UpdateCheckInTemplateResponse {
  CheckInTemplate template = 1;
}

message DeleteCheckInTemplateRequest {
  string guild_id = 1;
  string template_id = 2;
}

message DeleteCheckInTemplateResponse {
  bool success = 1;
}

message CheckInTemplate {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string title = 4;
  repeated Item loot_list = 5;
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
