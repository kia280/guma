syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service CheckInService {
  rpc ListCheckIns(ListCheckInsRequest) returns (ListCheckInsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/checkins"
    };
  }

  rpc GetCheckIn(GetCheckInRequest) returns (GetCheckInResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/checkins/{checkin_id}"
    };
  }

  rpc CreateCheckIn(CreateCheckInRequest) returns (CreateCheckInResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins"
      body: "*"
    };
  }

  rpc UpdateCheckIn(UpdateCheckInRequest) returns (UpdateCheckInResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/checkins/{checkin_id}"
      body: "*"
    };
  }

  rpc DeleteCheckIn(DeleteCheckInRequest) returns (DeleteCheckInResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/checkins/{checkin_id}"
    };
  }

  rpc CancelCheckIn(CancelCheckInRequest) returns (CancelCheckInResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins/{checkin_id}/cancel"
      body: "*"
    };
  }

  rpc CompleteCheckIn(CompleteCheckInRequest) returns (CompleteCheckInResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins/{checkin_id}/complete"
      body: "*"
    };
  }

  rpc UpdateCheckInLoot(UpdateCheckInLootRequest) returns (UpdateCheckInLootResponse) {
    option (google.api.http) = {
      put: "/v1/guilds/{guild_id}/checkins/{checkin_id}/loot"
      body: "*"
    };
  }

  // Member submits their attendance for a check-in
  rpc SubmitAttendance(SubmitAttendanceRequest) returns (SubmitAttendanceResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins/{checkin_id}/attend"
      body: "*"
    };
  }

  // List who attended a check-in
  rpc ListAttendees(ListAttendeesRequest) returns (ListAttendeesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/checkins/{checkin_id}/attendees"
    };
  }

  rpc AssignLoot(AssignLootRequest) returns (AssignLootResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins/{checkin_id}/loot/{item_id}/assign"
      body: "*"
    };
  }

  rpc GetCheckInGold(GetCheckInGoldRequest) returns (GetCheckInGoldResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/checkins/{checkin_id}/gold"
    };
  }

  rpc DistributeCheckInGold(DistributeCheckInGoldRequest) returns (DistributeCheckInGoldResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/checkins/{checkin_id}/gold/distribute"
      body: "*"
    };
  }
}

// Request/Response messages

message ListCheckInsRequest {
  string guild_id = 1;
  string status = 2;     // "active" | "expired" | "cancelled" | "completed" | "" (all)
  int32 page_size = 3;
  string page_token = 4;
}

message ListCheckInsResponse {
  repeated CheckIn checkins = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetCheckInRequest {
  string guild_id = 1;
  string checkin_id = 2;
}

message GetCheckInResponse {
  CheckIn checkin = 1;
}

message CreateCheckInRequest {
  string guild_id = 1;
  string title = 2;
  string description = 3;
  string datetime = 4;      // ISO 8601 datetime of the check-in event
  string expire_time = 5;   // ISO 8601 datetime when the window closes
  string image_url = 6;
  repeated Item loot_list = 7; // Items distributed to attendees
  repeated CheckInLootEntry loot = 8; // Supersedes loot_list when set; supports gold entries
}

message CreateCheckInResponse {
  CheckIn checkin = 1;
}

message UpdateCheckInRequest {
  string guild_id = 1;
  string checkin_id = 2;
  string title = 3;
  optional string description = 4;
  string datetime = 5;
  string expire_time = 6;
  optional string image_url = 7;
  repeated Item loot_list = 8;
  repeated CheckInLootEntry loot = 9;
}

message UpdateCheckInResponse {
  CheckIn checkin = 1;
}

message DeleteCheckInRequest {
  string guild_id = 1;
  string checkin_id = 2;
}

message DeleteCheckInResponse {
  bool success = 1;
}

message CancelCheckInRequest {
  string guild_id = 1;
  string checkin_id = 2;
}

message CancelCheckInResponse {
  CheckIn checkin = 1;
}

message CompleteCheckInRequest {
  string guild_id = 1;
  string checkin_id = 2;
}

message CompleteCheckInResponse {
  CheckIn checkin = 1;
}

message UpdateCheckInLootRequest {
  string guild_id = 1;
  string checkin_id = 2;
  repeated Item loot_list = 3;
}

message UpdateCheckInLootResponse {
  CheckIn checkin = 1;
}

message AssignLootRequest {
  string guild_id = 1;
  string checkin_id = 2;
  string item_id = 3;
  string user_id = 4;
}

message AssignLootResponse {
  string backpack_item_id = 1;
}

message GetCheckInGoldRequest {
  string guild_id = 1;
  string checkin_id = 2;
}

message GetCheckInGoldResponse {
  CheckInGoldPot pot = 1;
  repeated CheckInGoldPayout recipients = 2; // Total gold received per attendee
}

message DistributeCheckInGoldRequest {
  string guild_id = 1;
  string checkin_id = 2;
  string request_id = 3; // Client-generated UUID; repeating it returns the original result
  repeated CheckInGoldPayout payouts = 4;
}

message DistributeCheckInGoldResponse {
  string distribution_id = 1;
  CheckInGoldPot pot = 2;
  repeated CheckInGoldPayout payouts = 3;
  bool replayed = 4;
}

message SubmitAttendanceRequest {
  string guild_id = 1;
  string checkin_id = 2;
  string notes = 3;
}

message SubmitAttendanceResponse {
  CheckInAttendee attendee = 1;
}

message ListAttendeesRequest {
  string guild_id = 1;
  string checkin_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListAttendeesResponse {
  repeated CheckInAttendee attendees = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Data structures

message CheckIn {
  string id = 1;
  string guild_id = 2;
  string created_by = 3;
  string title = 4;
  string description = 5;
  string datetime = 6;
  string expire_time = 7;
  string image_url = 8;
  repeated Item loot_list = 9;
  int32 attendance_count = 10;
  bool is_expired = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  bool is_cancelled = 14;
  repeated CheckInLootEntry loot = 15; // All loot entries, including gold
  CheckInGoldPot gold_pot = 16;        // Unset when the roll call has no gold loot
  bool is_completed = 17;
  google.protobuf.Timestamp completed_at = 18;
}

// LootKind values: item, gold
message CheckInLootEntry {
  string kind = 1;
  Item item = 2;    // Set when kind is item
  int64 amount = 3; // Gold in minor units when kind is gold
}

message CheckInGoldPot {
  int64 total = 1;
  int64 distributed = 2;
  int64 retracted = 3;
  int64 remaining = 4;
}

message CheckInGoldPayout {
  string user_id = 1;
  int64 amount = 2;
}

message CheckInAttendee {
  string id = 1;
  string checkin_id = 2;
  string user_id = 3;
  string display_name = 4;
  string avatar_url = 5;
  google.protobuf.Timestamp attended_at = 6;
  string notes = 7;
}
