syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";
import "proto/guma/v1/validate.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service RaffleService {
  rpc ListRaffles(ListRafflesRequest) returns (ListRafflesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles"
    };
  }

  rpc GetRaffle(GetRaffleRequest) returns (GetRaffleResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
    };
  }

  rpc CreateRaffle(CreateRaffleRequest) returns (CreateRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles"
      body: "*"
    };
  }

  rpc PurchaseTickets(PurchaseTicketsRequest) returns (PurchaseTicketsResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/tickets"
      body: "*"
    };
  }

  rpc GetRaffleWinners(GetRaffleWinnersRequest) returns (GetRaffleWinnersResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles/{raffle_id}/winners"
    };
  }

  // Update a raffle that has not been drawn yet (admin action)
  rpc UpdateRaffle(UpdateRaffleRequest) returns (UpdateRaffleResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
      body: "*"
    };
  }

  rpc CancelRaffle(CancelRaffleRequest) returns (CancelRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/cancel"
      body: "*"
    };
  }

  rpc DeleteRaffle(DeleteRaffleRequest) returns (DeleteRaffleResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
    };
  }

  // Draw the raffle manually (admin action)
  rpc DrawRaffle(DrawRaffleRequest) returns (DrawRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/draw"
      body: "*"
    };
  }

  // List tickets owned by the current user
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsResponse) {
    option (google.api.http) = {
      get: "/v1/me/raffle-tickets"
    };
  }
}

// Request/Response messages

message ListRafflesRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string status = 2 [(buf.validate.field).string.max_len = 32];     // "active" | "upcoming" | "ended" | "cancelled" | "" (all)
  int32 page_size = 3 [(buf.validate.field).int32 = {[guma.v1.max_page_size]: 100}];
  string page_token = 4 [(buf.validate.field).string = {[guma.v1.page_token]: true}];
}

message ListRafflesResponse {
  repeated Raffle raffles = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRaffleRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetRaffleResponse {
  Raffle raffle = 1;
}

message CreateRaffleRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string title = 2 [(buf.validate.field).string = {max_len: 200, [guma.v1.not_blank]: true}];
  string description = 3 [(buf.validate.field).string.max_len = 2000];
  int64 ticket_price = 4 [(buf.validate.field).int64 = {[guma.v1.amount_or_zero]: true}];
  int32 max_tickets = 5 [(buf.validate.field).int32.gte = 0];         // 0 = unlimited
  int32 max_tickets_per_user = 6 [(buf.validate.field).int32.gte = 0]; // 0 = unlimited
  string draw_date = 7 [(buf.validate.field).required = true, (buf.validate.field).string.max_len = 64];           // ISO 8601 datetime
  repeated RafflePrize prizes = 8 [(buf.validate.field).repeated.max_items = 100];
}

message CreateRaffleResponse {
  Raffle raffle = 1;
}

message PurchaseTicketsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int32 quantity = 3 [(buf.validate.field).int32.gt = 0];
}

message PurchaseTicketsResponse {
  repeated RaffleTicket tickets = 1;
  int64 total_cost = 2;
}

message GetRaffleWinnersRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetRaffleWinnersResponse {
  repeated RaffleWinner winners = 1;
}

message DrawRaffleRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message DrawRaffleResponse {
  Raffle raffle = 1;
  repeated RaffleWinner winners = 2;
}

message UpdateRaffleRequest {
  option (buf.validate.message).cel = {
    id: "update_raffle.nothing_to_update"
    message: "nothing to update"
    expression: "has(this.title) || has(this.description) || this.draw_date != '' || has(this.ticket_price) || has(this.max_tickets) || has(this.max_tickets_per_user)"
  };

  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string draw_date = 3 [(buf.validate.field).string.max_len = 64]; // ISO 8601 datetime; must be in the future
  optional string title = 4 [(buf.validate.field).string = {max_len: 200, [guma.v1.not_blank]: true}];
  optional string description = 5 [(buf.validate.field).string.max_len = 2000];
  optional int64 ticket_price = 6 [(buf.validate.field).int64 = {[guma.v1.amount_or_zero]: true}];
  optional int32 max_tickets = 7 [(buf.validate.field).int32.gte = 0];
  optional int32 max_tickets_per_user = 8 [(buf.validate.field).int32.gte = 0];
}

message UpdateRaffleResponse {
  Raffle raffle = 1;
}

message CancelRaffleRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message CancelRaffleResponse {
  Raffle raffle = 1;
}

message DeleteRaffleRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string raffle_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message DeleteRaffleResponse {
  bool success = 1;
}

message ListMyTicketsRequest {
  string guild_id = 1 [(buf.validate.field).string.uuid = true, (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE]; // Optional: filter by guild
  int32 page_size = 2 [(buf.validate.field).int32 = {[guma.v1.max_page_size]: 100}];
  string page_token = 3 [(buf.validate.field).string = {[guma.v1.page_token]: true}];
}

message ListMyTicketsResponse {
  repeated RaffleTicket tickets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Data structures

// RaffleStatus values: upcoming, active, ended, cancelled

message Raffle {
  string id = 1;
  string guild_id = 2;
  string created_by = 3;
  string title = 4;
  string description = 5;
  int64 ticket_price = 6;
  int32 tickets_sold = 7;
  int32 max_tickets = 8;
  int32 max_tickets_per_user = 9;
  string status = 10;
  string draw_date = 11;        // ISO 8601 datetime
  repeated RafflePrize prizes = 12;
  repeated RaffleWinner winners = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp cancelled_at = 16;
}

message RafflePrize {
  int32 rank = 1 [(buf.validate.field).int32.gte = 0];          // 1st, 2nd, 3rd place
  string description = 2 [(buf.validate.field).string.max_len = 2000];
  int64 amount = 3 [(buf.validate.field).int64 = {[guma.v1.amount_or_zero]: true}];        // Currency prize; 0 if item prize
  Item item = 4;           // Item prize; unset if currency prize
  ItemSourceRef source = 5;
}

message RaffleTicket {
  string id = 1;
  string raffle_id = 2;
  string user_id = 3;
  string ticket_number = 4;
  google.protobuf.Timestamp purchased_at = 5;
}

message RaffleWinner {
  string id = 1;
  string raffle_id = 2;
  string user_id = 3;
  string username = 4;
  string avatar_url = 5;
  int32 rank = 6;
  int64 prize_amount = 7;
  string prize_description = 8;
  string ticket_number = 9;
}
