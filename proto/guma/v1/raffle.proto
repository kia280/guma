syntax = "proto3";

package guma.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

service RaffleService {
  rpc ListRaffles(ListRafflesRequest) returns (ListRafflesResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles"
    };
  }

  rpc GetRaffle(GetRaffleRequest) returns (GetRaffleResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
    };
  }

  rpc CreateRaffle(CreateRaffleRequest) returns (CreateRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles"
      body: "*"
    };
  }

  rpc PurchaseTickets(PurchaseTicketsRequest) returns (PurchaseTicketsResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/tickets"
      body: "*"
    };
  }

  rpc GetRaffleWinners(GetRaffleWinnersRequest) returns (GetRaffleWinnersResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/raffles/{raffle_id}/winners"
    };
  }

  // Update a raffle that has not been drawn yet (admin action)
  rpc UpdateRaffle(UpdateRaffleRequest) returns (UpdateRaffleResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
      body: "*"
    };
  }

  rpc CancelRaffle(CancelRaffleRequest) returns (CancelRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/cancel"
      body: "*"
    };
  }

  rpc DeleteRaffle(DeleteRaffleRequest) returns (DeleteRaffleResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/raffles/{raffle_id}"
    };
  }

  // Draw the raffle manually (admin action)
  rpc DrawRaffle(DrawRaffleRequest) returns (DrawRaffleResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/raffles/{raffle_id}/draw"
      body: "*"
    };
  }

  // List tickets owned by the current user
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsResponse) {
    option (google.api.http) = {
      get: "/v1/me/raffle-tickets"
    };
  }
}

// Request/Response messages

message ListRafflesRequest {
  string guild_id = 1;
  string status = 2;     // "active" | "upcoming" | "ended" | "cancelled" | "" (all)
  int32 page_size = 3;
  string page_token = 4;
}

message ListRafflesResponse {
  repeated Raffle raffles = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetRaffleRequest {
  string guild_id = 1;
  string raffle_id = 2;
}

message GetRaffleResponse {
  Raffle raffle = 1;
}

message CreateRaffleRequest {
  string guild_id = 1;
  string title = 2;
  string description = 3;
  int64 ticket_price = 4;
  int32 max_tickets = 5;         // 0 = unlimited
  int32 max_tickets_per_user = 6; // 0 = unlimited
  string draw_date = 7;           // ISO 8601 datetime
  repeated RafflePrize prizes = 8;
}

message CreateRaffleResponse {
  Raffle raffle = 1;
}

message PurchaseTicketsRequest {
  string guild_id = 1;
  string raffle_id = 2;
  int32 quantity = 3;
}

message PurchaseTicketsResponse {
  repeated RaffleTicket tickets = 1;
  int64 total_cost = 2;
}

message GetRaffleWinnersRequest {
  string guild_id = 1;
  string raffle_id = 2;
}

message GetRaffleWinnersResponse {
  repeated RaffleWinner winners = 1;
}

message DrawRaffleRequest {
  string guild_id = 1;
  string raffle_id = 2;
}

message DrawRaffleResponse {
  Raffle raffle = 1;
  repeated RaffleWinner winners = 2;
}

message UpdateRaffleRequest {
  string guild_id = 1;
  string raffle_id = 2;
  string draw_date = 3; // ISO 8601 datetime; must be in the future
  optional string title = 4;
  optional string description = 5;
  optional int64 ticket_price = 6;
  optional int32 max_tickets = 7;
  optional int32 max_tickets_per_user = 8;
}

message UpdateRaffleResponse {
  Raffle raffle = 1;
}

message CancelRaffleRequest {
  string guild_id = 1;
  string raffle_id = 2;
}

message CancelRaffleResponse {
  Raffle raffle = 1;
}

message DeleteRaffleRequest {
  string guild_id = 1;
  string raffle_id = 2;
}

message DeleteRaffleResponse {
  bool success = 1;
}

message ListMyTicketsRequest {
  string guild_id = 1; // Optional: filter by guild
  int32 page_size = 2;
  string page_token = 3;
}

message ListMyTicketsResponse {
  repeated RaffleTicket tickets = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// Data structures

// RaffleStatus values: upcoming, active, ended, cancelled

message Raffle {
  string id = 1;
  string guild_id = 2;
  string created_by = 3;
  string title = 4;
  string description = 5;
  int64 ticket_price = 6;
  int32 tickets_sold = 7;
  int32 max_tickets = 8;
  int32 max_tickets_per_user = 9;
  string status = 10;
  string draw_date = 11;        // ISO 8601 datetime
  repeated RafflePrize prizes = 12;
  repeated RaffleWinner winners = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  google.protobuf.Timestamp cancelled_at = 16;
}

message RafflePrize {
  int32 rank = 1;          // 1st, 2nd, 3rd place
  string description = 2;
  int64 amount = 3;        // Currency prize; 0 if item prize
  Item item = 4;           // Item prize; unset if currency prize
  ItemSourceRef source = 5;
}

message RaffleTicket {
  string id = 1;
  string raffle_id = 2;
  string user_id = 3;
  string ticket_number = 4;
  google.protobuf.Timestamp purchased_at = 5;
}

message RaffleWinner {
  string id = 1;
  string raffle_id = 2;
  string user_id = 3;
  string username = 4;
  string avatar_url = 5;
  int32 rank = 6;
  int64 prize_amount = 7;
  string prize_description = 8;
  string ticket_number = 9;
}
