syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "proto/guma/v1/item.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// AuctionStatus values: UPCOMING, ACTIVE, ENDED, CANCELLED

service AuctionService {
  rpc ListAuctions(ListAuctionsRequest) returns (ListAuctionsResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/auctions"
    };
  }

  rpc GetAuction(GetAuctionRequest) returns (GetAuctionResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/auctions/{auction_id}"
    };
  }

  rpc CreateAuction(CreateAuctionRequest) returns (CreateAuctionResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/auctions"
      body: "*"
    };
  }

  rpc PlaceBid(PlaceBidRequest) returns (PlaceBidResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/auctions/{auction_id}/bids"
      body: "*"
    };
  }

  // Returns the full ordered bid history for an auction
  rpc GetBidHistory(GetBidHistoryRequest) returns (GetBidHistoryResponse) {
    option (google.api.http) = {
      get: "/v1/guilds/{guild_id}/auctions/{auction_id}/bids"
    };
  }

  rpc UpdateAuction(UpdateAuctionRequest) returns (UpdateAuctionResponse) {
    option (google.api.http) = {
      patch: "/v1/guilds/{guild_id}/auctions/{auction_id}"
      body: "*"
    };
  }

  rpc DeleteAuction(DeleteAuctionRequest) returns (DeleteAuctionResponse) {
    option (google.api.http) = {
      delete: "/v1/guilds/{guild_id}/auctions/{auction_id}"
    };
  }

  rpc CancelAuction(CancelAuctionRequest) returns (CancelAuctionResponse) {
    option (google.api.http) = {
      post: "/v1/guilds/{guild_id}/auctions/{auction_id}/cancel"
      body: "*"
    };
  }
}

// Request/Response messages

message ListAuctionsRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string status = 2;    // AuctionStatus filter; empty = all
  string category = 3;  // Item.category filter
  string rarity = 4;    // Item.rarity filter
  string search = 5;
  int32 page_size = 6 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 7 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message ListAuctionsResponse {
  repeated AuctionItem auctions = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message GetAuctionRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message GetAuctionResponse {
  AuctionItem auction = 1;
}

message CreateAuctionRequest {
  option (buf.validate.message).cel = {
    id: "create_auction.item_name_required"
    message: "item name is required unless the item comes from a backpack or bank source"
    expression: "(has(this.source) && (this.source.backpack_item_id != '' || this.source.bank_item_id != '')) || (has(this.item) && this.item.name != '')"
  };

  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  Item item = 2;
  int64 starting_bid = 3;
  int64 min_bid_increment = 4;
  int32 duration_hours = 5;
  bool is_blind = 6;
  string status = 7; // "UPCOMING" (scheduled) or "ACTIVE" (starts immediately)
  ItemSourceRef source = 8;
}

message CreateAuctionResponse {
  AuctionItem auction = 1;
}

message PlaceBidRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int64 amount = 3;
}

message PlaceBidResponse {
  AuctionItem auction = 1;
  Bid bid = 2;
}

message GetBidHistoryRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 4 [(buf.validate.field).string = {max_len: 10, pattern: "^[0-9]*$"}];
}

message GetBidHistoryResponse {
  repeated Bid bids = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

message UpdateAuctionRequest {
  option (buf.validate.message).cel = {
    id: "update_auction.end_after_start"
    message: "end time must be after start time"
    expression: "!has(this.start_time) || !has(this.end_time) || this.end_time > this.start_time"
  };

  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  Item item = 3 [(buf.validate.field).cel = {
    id: "update_auction.item_name_required"
    message: "item name is required"
    expression: "this.name.trim() != ''"
  }];
  optional int64 starting_bid = 4 [(buf.validate.field).int64.gt = 0];
  optional int64 min_bid_increment = 5 [(buf.validate.field).int64.gt = 0];
  optional bool is_blind = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
}

message UpdateAuctionResponse {
  AuctionItem auction = 1;
}

message DeleteAuctionRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
}

message DeleteAuctionResponse {
  bool success = 1;
}

message CancelAuctionRequest {
  string guild_id = 1 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string auction_id = 2 [(buf.validate.field).required = true, (buf.validate.field).string.uuid = true];
  string reason = 3;
}

message CancelAuctionResponse {
  AuctionItem auction = 1;
}

// Data structures

message AuctionItem {
  string id = 1;
  string guild_id = 2;
  string seller_id = 3;
  Item item = 4;
  int64 starting_bid = 5;
  int64 current_bid = 6;
  string current_bidder_id = 7;
  int64 min_bid_increment = 8;
  google.protobuf.Timestamp start_time = 9;
  google.protobuf.Timestamp end_time = 10;
  string status = 11;
  bool is_blind = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  string source_type = 15;
  google.protobuf.Timestamp cancelled_at = 16;
  string seller_name = 17;
  string seller_avatar_url = 18;
  string current_bidder_name = 19;
  string current_bidder_avatar_url = 20;
}

message Bid {
  string id = 1;
  string auction_id = 2;
  string bidder_id = 3;
  int64 amount = 4;
  bool is_winning = 5;
  google.protobuf.Timestamp placed_at = 6;
  string bidder_username = 7;
  string bidder_avatar_url = 8;
}
