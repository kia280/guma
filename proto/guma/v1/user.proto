syntax = "proto3";

package guma.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/kia280/guma/gen/proto/guma/v1;gumav1";

// The authenticated-principal resource (/v1/me) is kept separate from the
// /v1/users collection so the wildcard {user_id} path does not collide
// with the literal "me" segment.
service UserService {
  // Get authenticated user's profile
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {
      get: "/v1/me"
    };
  }

  // Update authenticated user's profile
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {
    option (google.api.http) = {
      patch: "/v1/me"
      body: "*"
    };
  }

  // Get authenticated user's aggregate stats
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse) {
    option (google.api.http) = {
      get: "/v1/me/stats"
    };
  }

  // Get any user's public profile
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}"
    };
  }
}

// Request/Response messages

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

message UpdateMeRequest {
  string display_name = 1 [(buf.validate.field).string.max_len = 32];
  string username = 2 [(buf.validate.field).string.max_len = 32];
  string bio = 3 [(buf.validate.field).string.max_len = 500];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 2048];
}

message UpdateMeResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.max_len = 64];
}

message GetUserResponse {
  User user = 1;
}

message GetUserStatsRequest {}

message GetUserStatsResponse {
  UserStats stats = 1;
}

// Data structures

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string email = 4;
  string avatar_url = 5;
  string bio = 6;
  repeated string guild_ids = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string current_guild_id = 10;
  int64 balance = 11;
  optional bool email_verified = 12;
  LinkedAccount discord = 13;
  string guild_role = 14;
}

message LinkedAccount {
  string provider = 1;
  string subject = 2;
  string username = 3;
}

message UserStats {
  int32 guilds_joined = 1;
  int32 events_attended = 2;
  int32 auctions_won = 3;
  int32 raffles_won = 4;
  int64 total_earned = 5;
  int64 total_spent = 6;
  int32 roll_calls_attended = 7;
}
