services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile.dev.backend
    volumes:
      - ..:/workspace
      - go-mod-cache:/go/pkg/mod:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kratos:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://guma:password@postgres:5432/guma?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - KRATOS_ADMIN_URL=http://kratos:4434
      - ENV=development

  frontend:
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile.dev.frontend
    volumes:
      - ..:/workspace
      - node-modules-cache:/workspace/web/node_modules:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kratos:
        condition: service_healthy
    working_dir: /workspace/web

  nginx:
    image: nginx:stable
    ports:
      - "8081:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kratos
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: guma
      POSTGRES_USER: guma
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guma"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8.2.3
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  kratos:
    image: oryd/kratos:v25.4.0
    environment:
      - DSN=postgres://guma:password@postgres:5432/guma?sslmode=disable&max_conns=20&max_idle_conns=4
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4433/health/alive"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./config/kratos:/etc/config/kratos/:ro
    entrypoint: /bin/sh -c "kratos migrate sql -e -y && kratos serve --config /etc/config/kratos/kratos.yaml --dev"

  keto:
    image: oryd/keto:v25.4.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4466/health/alive"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./config/keto:/etc/config/keto/:ro
    entrypoint: keto serve --sqa-opt-out -c /etc/config/keto/config.yaml

volumes:
  go-mod-cache:
  node-modules-cache:
  postgres_data:
  redis_data:
  minio_data:
