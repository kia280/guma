name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.59.0
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf generate
        run: |
          buf generate
          git add -N gen openapi
          git diff --exit-code gen openapi
      - name: buf breaking
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: buf breaking --against ".git#ref=refs/remotes/origin/${{ github.base_ref }}"

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: 1.30.0
      - name: sqlc vet
        run: sqlc vet
      - name: sqlc generate
        run: |
          sqlc generate
          git add -N internal/db/sqlc
          git diff --exit-code internal/db/sqlc

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
